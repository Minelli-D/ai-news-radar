version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/collector"]
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories: ["/bootstrap", "/infra"]
    schedule:
      interval: monthly
