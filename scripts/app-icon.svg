    <circle cx="16" cy="16" r="10.5" fill="none" stroke="#dde8ec" stroke-opacity=".4" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="5.5" fill="none" stroke="#dde8ec" stroke-opacity=".4" stroke-width="1.5"/>
    <path d="M16 16V.5a15.5 15.5 0 0 1 13.42 7.75z" fill="#f28ac6" fill-opacity=".5"/>
    <circle cx="16" cy="16" r="2" fill="#dde8ec"/>
    <circle cx="22.2" cy="7.2" r="2.2" fill="#f28ac6"/>
  </g>
</svg>
