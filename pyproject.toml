[project]
name = "ai-news-radar"
version = "1.0.0"
description = "Serverless aggregator of AI news: AWS Lambda, DynamoDB, S3, CloudFront, Terraform, GitHub Actions."
requires-python = ">=3.12,<3.13"
license = "MIT"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "PTH", "C4", "RET", "N", "DTZ"]
# Real-world titles use typographic quotes and dashes on purpose.
allowed-confusables = ["’", "‘", "–", "—"]

[tool.ruff.lint.per-file-ignores]
# Tests assert freely, parse the XML we generate ourselves, hold long URL/title literals,
# and give offline botocore Stubber clients dummy credentials.
"tests/**" = ["S101", "S106", "S314", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["collector"]

[[tool.mypy.overrides]]
module = ["feedparser.*", "protego.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true
